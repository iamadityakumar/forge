services:
  postgres:
    image: postgres:15-alpine
    container_name: forge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: forge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Orchestrator API (built from the local Dockerfile).
  # On an Oracle ARM VM this builds natively for linux/arm64.
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: forge-orchestrator:latest
    container_name: forge-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:secret@postgres:5432/forge?sslmode=disable
      MAX_PENDING_JOBS: ${MAX_PENDING_JOBS:-0}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_METRICS_URLS: ${WORKER_METRICS_URLS:-worker-1=http://worker-1:9091/metrics,worker-2=http://worker-2:9091/metrics,worker-3=http://worker-3:9091/metrics,worker-4=http://worker-4:9091/metrics}
      # When set (e.g. http://jaeger:4318 with the observability profile), spans
      # are also exported via OTLP alongside the slog span lines.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - ./web:/app/web
    depends_on:
      postgres:
        condition: service_healthy

  # Worker pool: 4 workers competing for jobs against one Postgres queue.
  # Explicit services (rather than deploy.replicas) so each gets a distinct
  # WORKER_ID, which the claim query stamps on claimed_by and the trace/logs
  # use to prove a *different* worker resumed after a kill -9. Scale by adding
  # more worker-N services. Each worker runs up to WORKER_CONCURRENCY jobs at
  # once (U6 bounded concurrency, default 1 = serial); both WORKER_LEASE and
  # WORKER_CONCURRENCY are env-overridable for the crash-recovery demo.
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: forge-worker:latest
    container_name: forge-worker-1
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      DATABASE_URL: postgres://postgres:secret@postgres:5432/forge?sslmode=disable
      WORKER_ID: worker-1
      WORKER_LEASE: ${WORKER_LEASE:-2m}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-10}
      RUN_TESTS_TIMEOUT_MS: ${RUN_TESTS_TIMEOUT_MS:-2000}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-0}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      UPSTASH_URL: ${UPSTASH_URL:-}
      UPSTASH_TOKEN: ${UPSTASH_TOKEN:-}
      METRICS_PORT: ${METRICS_PORT:-9091}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: forge-worker:latest
    container_name: forge-worker-2
    restart: unless-stopped
    ports:
      - "9092:9091"
    environment:
      DATABASE_URL: postgres://postgres:secret@postgres:5432/forge?sslmode=disable
      WORKER_ID: worker-2
      WORKER_LEASE: ${WORKER_LEASE:-2m}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-10}
      RUN_TESTS_TIMEOUT_MS: ${RUN_TESTS_TIMEOUT_MS:-2000}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-0}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      UPSTASH_URL: ${UPSTASH_URL:-}
      UPSTASH_TOKEN: ${UPSTASH_TOKEN:-}
      METRICS_PORT: ${METRICS_PORT:-9091}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker-3:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: forge-worker:latest
    container_name: forge-worker-3
    restart: unless-stopped
    ports:
      - "9093:9091"
    environment:
      DATABASE_URL: postgres://postgres:secret@postgres:5432/forge?sslmode=disable
      WORKER_ID: worker-3
      WORKER_LEASE: ${WORKER_LEASE:-2m}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-10}
      RUN_TESTS_TIMEOUT_MS: ${RUN_TESTS_TIMEOUT_MS:-2000}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-0}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      UPSTASH_URL: ${UPSTASH_URL:-}
      UPSTASH_TOKEN: ${UPSTASH_TOKEN:-}
      METRICS_PORT: ${METRICS_PORT:-9091}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy

  worker-4:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: forge-worker:latest
    container_name: forge-worker-4
    restart: unless-stopped
    ports:
      - "9094:9091"
    environment:
      DATABASE_URL: postgres://postgres:secret@postgres:5432/forge?sslmode=disable
      WORKER_ID: worker-4
      WORKER_LEASE: ${WORKER_LEASE:-2m}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-}
      GROQ_MODEL: ${GROQ_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60s}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-10}
      RUN_TESTS_TIMEOUT_MS: ${RUN_TESTS_TIMEOUT_MS:-2000}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      RATE_LIMIT_TPM: ${RATE_LIMIT_TPM:-0}
      RATE_LIMIT_RPM: ${RATE_LIMIT_RPM:-0}
      UPSTASH_URL: ${UPSTASH_URL:-}
      UPSTASH_TOKEN: ${UPSTASH_TOKEN:-}
      METRICS_PORT: ${METRICS_PORT:-9091}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    container_name: forge-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: forge-jaeger
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "16686:16686"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # Caddy (HTTPS reverse proxy for DuckDNS)
  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DUCKDNS_DOMAIN: 4orge.duckdns.org
      DUCKDNS_TOKEN: ${DUCKDNS_TOKEN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
