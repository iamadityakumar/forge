[project]
name = "forge-langgraph-agent"
version = "0.1.0"
description = "Standalone LangGraph competitive-programming agent (Forge Phase 1)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-groq>=0.2",
    "fastapi>=0.110",
    "uvicorn>=0.28",
    "pydantic>=2.0",
    "httpx>=0.27",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
forge-langgraph-agent = "forge_langgraph_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
